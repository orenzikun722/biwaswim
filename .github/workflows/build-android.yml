name: Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # GitHubのリポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      # JDKをセットアップ
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Gradle実行権限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Debug APKをビルド
      - name: Build APK
        run: ./gradlew assembleDebug

      # APKをArtifactsとして保存
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/*.apk